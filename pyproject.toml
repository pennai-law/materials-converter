[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-converter"
version = "1.0.0"
description = "Convert PDF, DOCX, PPTX, and HTML to clean, AI-ingestion-ready markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Teaching Lab, Penn Carey Law" }]
keywords = ["markdown", "pdf", "docx", "pptx", "document-conversion", "docling", "ai"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "docling>=2.0.0",
    "PyMuPDF>=1.23.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "reportlab>=4.0.0"]

[project.urls]
Homepage = "https://github.com/ai-teaching-lab/materials-converter"
Repository = "https://github.com/ai-teaching-lab/materials-converter"

[project.scripts]
materials-convert = "convert:main"

[tool.setuptools]
packages = ["materials", "materials.core", "materials.formats"]
py-modules = ["convert"]
